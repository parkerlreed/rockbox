<svg xmlns="http://www.w3.org/2000/svg" width="350" height="591" viewBox="0 0 350 591">
  <!-- iPod Video (5G) face for the simulator, in anodised aluminium. Same
       geometry as UI-ipodvideo.bmp: LCD at 14,12 (320x240), clickwheel
       centred at 174,437 with radius 123 and centre button radius 45.

       window-sdl.c draws each run of groups whose ids start with "body",
       "wheel" or "label" in white and colours it when rendering, so the
       colour can change instantly; it fills {body}, {wheel}, {button} and
       {label} with white. Other groups are drawn as they are. -->
  <defs>
    <linearGradient id="sheen" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.02"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.25"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2a2e"/>
      <stop offset="1" stop-color="#050505"/>
    </linearGradient>
    <radialGradient id="wheelshade" cx="174" cy="437" r="123" gradientUnits="userSpaceOnUse">
      <stop offset="0.9" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.06"/>
    </radialGradient>
  </defs>

  <g id="body-case">
    <rect x="0" y="0" width="350" height="591" rx="16" fill="{body}"/>
  </g>

  <g id="case-details">
    <rect x="0" y="0" width="350" height="591" rx="16" fill="url(#sheen)"/>
    <rect x="1" y="1" width="348" height="589" rx="15" fill="none"
          stroke="url(#edge)" stroke-width="2"/>
    <!-- screen glass around the LCD -->
    <rect x="8" y="6" width="334" height="252" rx="9" fill="url(#glass)"/>
    <rect x="8.5" y="6.5" width="333" height="251" rx="8.5" fill="none"
          stroke="#000000" stroke-opacity="0.5" stroke-width="1"/>
    <rect x="14" y="12" width="320" height="240" fill="#000000"/>
    <circle cx="174" cy="437" r="124" fill="#000000" fill-opacity="0.08"/>
  </g>

  <g id="wheel">
    <circle cx="174" cy="437" r="123" fill="{wheel}"/>
  </g>

  <g id="wheel-details">
    <circle cx="174" cy="437" r="123" fill="url(#wheelshade)"/>
    <circle cx="174" cy="437" r="122.5" fill="none" stroke="#000000"
            stroke-opacity="0.10" stroke-width="1"/>
    <circle cx="174" cy="437" r="45.5" fill="#000000" fill-opacity="0.10"/>
  </g>

  <g id="body-button">
    <circle cx="174" cy="437" r="45" fill="{button}"/>
  </g>

  <g id="label" fill="{label}">
    <!-- MENU, centred at 174, 336 -->
    <path d="M152,331 h2.6 l3.4,6 l3.4,-6 h2.6 v11 h-2.4 v-7 l-3,5.2 h-1.2 l-3,-5.2 v7 h-2.4 z"/>
    <path d="M166.5,331 h7.6 v2.1 h-5.2 v2.4 h4.6 v2.1 h-4.6 v2.3 h5.3 v2.1 h-7.7 z"/>
    <path d="M176.4,331 h2.4 l4.6,7 v-7 h2.4 v11 h-2.4 l-4.6,-7 v7 h-2.4 z"/>
    <path d="M188.2,331 h2.4 v7 a2.6,2.6 0 0 0 5.2,0 v-7 h2.4 v7 a5,5 0 0 1 -10,0 z"/>
    <!-- previous, centred at 70, 437 -->
    <rect x="61" y="431.5" width="2.2" height="11"/>
    <path d="M63.5,437 l7,-5.5 v11 z"/>
    <path d="M70.5,437 l7,-5.5 v11 z"/>
    <!-- next, centred at 278, 437 -->
    <path d="M270.5,431.5 l7,5.5 l-7,5.5 z"/>
    <path d="M277.5,431.5 l7,5.5 l-7,5.5 z"/>
    <rect x="284.8" y="431.5" width="2.2" height="11"/>
    <!-- play/pause, centred at 174, 540 -->
    <path d="M163.5,534.5 l8,5.5 l-8,5.5 z"/>
    <rect x="175" y="534.5" width="2.6" height="11"/>
    <rect x="180" y="534.5" width="2.6" height="11"/>
  </g>
</svg>
